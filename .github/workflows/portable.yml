name: Portable builds

# On-demand, no-install "portable" preview builds.
#   macOS   -> arm64 .zip        (unzip -> "Skill Recorder.app")
#   Windows -> x64 portable .exe (single self-contained executable)
#
# Runs ONLY when started by hand (workflow_dispatch) -- never on push or pull
# request -- so ordinary merges don't spend ~10-15 min packaging. The always-on
# Windows / Non-Windows workflows keep typechecking, testing, and (on Windows)
# packaging on pull requests and main pushes.
#
# Unsigned by design: macOS arm64 carries only the automatic *ad-hoc* signature
# (mac.identity "-" in package.json) so it launches after a one-time Gatekeeper
# bypass; Windows is not signed (SmartScreen -> "More info" -> "Run anyway").
# Enabling real signing later is additive: add the signing secrets; this
# workflow needs no structural change.
#
# Forward-compatible extension point (tracked in #20): add a Windows-arm64 leg
# with a `windows-11-arm` runner + a `dist:portable:win:arm64` script.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (arm64)
            name: macOS-arm64
            build_script: dist:portable:mac
            artifact_path: release/*.zip
          - os: windows-latest # x64
            name: Windows-x64
            build_script: dist:portable:win
            artifact_path: release/*.exe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Validate lockfile portability
        run: npm run check:lockfile

      - run: npm ci --ignore-scripts=false --dangerously-allow-all-scripts=false --strict-allow-scripts

      - name: Package portable app
        run: npm run ${{ matrix.build_script }}
        env:
          # Unsigned preview. macOS arm64 still gets the automatic ad-hoc
          # signature from mac.identity "-"; this only disables Developer ID
          # auto-discovery so the runner's empty keychain isn't consulted.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-recorder-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Upload compliance companion
        uses: actions/upload-artifact@v4
        with:
          name: skill-recorder-${{ matrix.name }}-compliance
          path: .compliance/**
          include-hidden-files: true
          if-no-files-found: error
